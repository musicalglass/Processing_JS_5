<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Switch Case Simplified</title>
  <script src="../p5.min.js"></script>
</head>
<body bgcolor="#999999">

<script>
/** <Description>
 * Use Switch to flip between different Case Statements.
 * Also known as a "State Machine"
</Description> */

let gameState = "Intro";
let lastKeyCode = null;

function setup() {
  createCanvas(400, 400);
  textSize(18);
}

function keyPressed() {
  lastKeyCode = keyCode; // capture one key press
}

function draw() {
  background(0);

  switch (gameState) {

    case "Intro":
      fill(127, 0, 255);
      text(
        "Welcome to myGameName\n\nClick the Game Window to Begin",
        66, 154
      );
      if (mouseIsPressed) {
        gameState = "Main";
      }
      break;

    case "Main":
      fill(0, 0, 255);
      text(
        "Game Code Goes Here\n\nPress 1 to proceed a level",
        90, 100
      );
      if (lastKeyCode === 49) { // '1'
        gameState = 1;
      }
      break;

    case 1:
      fill(255, 127, 0);
      text(
        "Level 1 Code\n\nPress 2 to proceed a level",
        90, 100
      );
      if (lastKeyCode === 50) { // '2'
        gameState += 1;
      }
      break;

    case 2:
      fill(0, 255, 0);
      text(
        "Level 2 Code\n\nPress 3 to proceed a level",
        90, 100
      );
      if (lastKeyCode === 51) { // '3'
        gameState += 1;
      }
      break;

    case 3:
      fill(255, 255, 0);
      text(
        "Level 3 Code\n\nPress 4 to proceed a level",
        90, 100
      );
      if (lastKeyCode === 52) { // '4'
        gameState += 1;
      }
      break;

    default:
      fill(255, 0, 0);
      text(
        "Game Over\n\nPress the Left Arrow Key\nto start over",
        90, 103
      );
      if (lastKeyCode === LEFT_ARROW) {
        gameState = "Main";
      }
      break;
  }

  // clear key so it doesn't repeat every frame
  lastKeyCode = null;
}

</script>

</body>
</html>
