<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Passing Arguments to a Function</title>
  <script src="../p5.min.js"></script>
</head>
<body bgcolor="#999999">

<script>
function setup() {
describe('Passing Arguments to a Function.');
  createCanvas(400, 400);
  background(255);

  strokeWeight(24); // Set the Point Size

  // Draw a point normally
  stroke(0);
  point(100, 100);

  // Now we'll do the same thing using a reusable Function
  makeYerPoint(200, 200, color(255, 0, 0));
  makeYerPoint(250, 200, color(0, 0, 255));
}

// Reusable function
function makeYerPoint(pointX, pointY, pointColor) {
  // Arguments passed to the function become pointX, pointY & pointColor
  stroke(pointColor);
  point(pointX, pointY);
}

</script>

</body>
</html>
