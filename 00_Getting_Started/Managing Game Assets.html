<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Managing Game Assets</title>
  <script src="../p5.min.js"></script>
</head>
<body bgcolor="#999999">

<script>
// Declare Variables Outside the Loop
let myReusableVar = 250;

function preload() {
  // Load image from GitHub (RAW URL)
  flippy = loadImage(   "https://raw.githubusercontent.com/musicalglass/Processing_JS_5/master/assets/Flippy.png"
  );
}

function setup() {
describe('Reuse images and variables.');
createCanvas(400, 400);
background(255);
}

// Begin Game Loop
draw = function() {
// Reuse loaded image over and over ☺
image(flippy, 10, 20); 
image(flippy, myReusableVar, 20); 
image(flippy, 10, myReusableVar); 
image(flippy, myReusableVar, myReusableVar); 
}; // end Game Loop

</script>

</body>
</html>
