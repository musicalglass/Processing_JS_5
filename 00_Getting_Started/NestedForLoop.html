<!DOCTYPE html>

<head>
  <meta charset="utf-8" />
  <title>Nested For Loops</title>
  <script src="../p5.min.js"></script>
</head>
<body bgcolor="#999999">

<script>
/*<Description> Use For Loop to create a Column of Rectangles. Use a second For Loop to create Rows of Columns. 
</Description>
Try playing with the Numbers! :) */

// For( startValue; While True; Increment Value )
// Starting at 100; Until it reaches 300; Add 20 each loop
// Rows
function setup() {
describe('Nested For Loops.');
  createCanvas(400, 400);
  for (var countX = 100; countX <= 300; countX += 20){
	// Columns   
			for(var countY = 100; countY <= 300; countY += 20){
	// Use Variables from the For Loops to set Rectangle Positions
				rect( countX, countY, 12, 12 ) ; 
			}
			
	}
}

</script>
