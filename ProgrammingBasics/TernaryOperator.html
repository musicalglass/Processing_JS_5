<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Ternary Operator</title>
  <script src="../p5.min.js"></script>
</head>
<body bgcolor="#999999">

<script>

function setup() {
	describe('A Variable that can do one of 2 things depending on whether a Condition is True.');

	createCanvas(400, 400);

	background(49, 0, 128); 

	// A variable to switch depending on conditions
	var conditionalColor = 0; 

	strokeWeight(10); 

	for(var i = 40; i <= 360; i += 10){
	// Is (i Divisible by 20)? if yes, Value = 0 : otherwise 255
	  conditionalColor = ( i % 20) ? 0 : 255; 
	  // Set the stroke color depending on Condition
	  stroke(conditionalColor); 
	  line(i, i, i, 30); // Draw lines
	}
}

</script>

</body>
</html>
