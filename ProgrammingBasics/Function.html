<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Function</title>
  <script src="../p5.min.js"></script>
</head>
<body bgcolor="#999999">

<script>
/* <Description> Demonstrates drawing a random Point normally, and then doing the same thing using a Function. </Description> */

function setup() {
	describe('A function to draw a random point which can be called over and over.');

	createCanvas(400, 400);
	background(255);

	strokeWeight(24); // Make it a big one

	// Draw a point normally
	point(random(20,300), random(20,180));

	// Create a reusable Function
	var makeYerPoint = function(){
		point(random(20,300), random(220,380));
	};

	// Call the Function as many times as you like :)
	makeYerPoint();
	makeYerPoint();
}

</script>

</body>
</html>
