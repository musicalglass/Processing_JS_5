<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Timing Events using Frame Counter</title>
  <script src="../p5.min.js"></script>
</head>
<body bgcolor="#999999">

<script>
function setup() {
describe('Fire events using built in frameCount Function.');
  createCanvas(400, 400);
}

// so you can think in seconds instead of FPS
var framesPerSecond = 60; 

// The Draw loop repeats approximately 60 Frames Per Second
// Begin Game Loop
draw = function(){
background(0); // Erase all and clear the Screen Black
fill(255)	// set text color
textSize(12); // Change Text Size
text("Frame Count: " + frameCount,10 , 30); 

textSize(36);
if ((frameCount > framesPerSecond * 3) && 
    (frameCount < framesPerSecond * 7)){
    text("In the beginning..",70,150);
}
if ((frameCount > framesPerSecond * 9) && 
    (frameCount < framesPerSecond * 15)){
    text("there was nothing...",50,150);
}
if ((frameCount > framesPerSecond * 17) && 
    (frameCount < framesPerSecond * 21)) {
    text("which exploded!",66,150);
}
if (frameCount > framesPerSecond * 23) {
    textSize(24);
    text("Tutorials in plain English",70,150);
    text("by Dillinger",136,185);
}
// Use an exact number to jump to specific point at 1/60 Second.
if (frameCount > 1600) { 
    frameCount = 0; // Go back to the beginning
/* Notice that the built in Timer Variable can be set back to 0. All the built in Function does is increment a Variable by 1. By resetting the frameCount Variable to whatever you like, you can jump forward or backward to any point in your animation :) */
}
}; // End Game Loop

</script>

</body>
</html>
