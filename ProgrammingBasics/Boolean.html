<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Boolean</title>
  <script src="../p5.min.js"></script>
</head>
<body bgcolor="#999999">

<script>
// Reload page to "Flip a Coin"
function setup() {
describe('Print one of two possible outcomes when the page is loaded.');
createCanvas(400, 400);

/*** <Description> A Boolean only has 1 of 2 States:
On or Off
true or false
0 or 1
Zero or Non Zero
***/

fill(0);
textSize(24);
textAlign(CENTER,0);

var myBoolean = false;
var randNumb = floor(random(2));

if(randNumb){ myBoolean = true; }
else{ myBoolean = false; }

if(myBoolean){
    text("Heads\nBooleans are useful: " + myBoolean, 200, 200);
}
else{
    text("Tails\nBooleans can do anything: " + myBoolean, 200, 200);
}
}

</script>

</body>
</html>
